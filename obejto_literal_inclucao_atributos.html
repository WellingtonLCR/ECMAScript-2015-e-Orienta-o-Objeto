<!DOCTYPE html>
<html>
    <head>
        <title>Objeto Literal - Inclusão de Atributos</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">
            let pessoa = {
                nome: 'Maria',
                idade: 25,
            }
            console.log(pessoa);
            //-----------------------------------------
            pessoa.sexo = 'Feminino'
            console.log(pessoa);

            pessoa.dizerOI = () => {
                console.log('Ola, tudo bem?');
            }
            pessoa.dizerOI()
        </script>
    </head>

    <body>
        <div id="output"></div>
    </body>
</html>
