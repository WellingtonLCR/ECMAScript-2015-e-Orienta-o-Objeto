<!DOCTYPE html>
<html>
    <head>
        <title>Destructuring - Parte 4</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">
            /*
                //array
                let arr = [10, 20, 30, 40]

                let [a,...x] = arr
                console.log(a)//
                console.log(x) //[20, 30, 40]
            */

           //object
           let obj = { a: 10, b: 20, c: 30, d: 40 }

           let { a, ...z } = obj
           console.log(a)//
           console.log(z) // { b: 20, c: 30, d: 40 }
        </script>
    </head>

    <body>
        <div id="output"></div>
    </body>
</html>
