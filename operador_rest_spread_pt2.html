<!DOCTYPE html>
<html>

    <head>
        <title>Operador Rest e Spread Parte 2</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">
            //contexto Rest
            function soma(...param) {
                let resultado = 0
                console.log(param)
                param.forEach(v => resultado += v)
                return resultado
            }

            console.log('Resultado da Soma: ' + soma(3, 8, 5, 7, -8, 10, 115))

            function multiplicacao(m, ...p) {
                console.log(m)
                let resultado = 0
                console.log(p)
                p.forEach(v => resultado += m * v)

                return resultado
            }
            console.log('Resultado da multiplicaçao: ' + multiplicacao(5, 7, 12, 3, 49))
        </script>
    </head>

    <body>
        <div id="output"></div>
    </body>
</html>
