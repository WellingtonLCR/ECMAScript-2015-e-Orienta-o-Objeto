<!DOCTYPE html>
<html>
    <head>
        <title>Object prototype</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">
            
            //avião
            //atributos cor e modelo; metodo levantarVoo

            //objeto Literal
            let a1 = {
                cor: 'Branco',
                modelo: 'Airbus A380',
                levantarVoo: function () { console.log('Voo levantado') }
            }

            //Funçao Construtora
            let AviaoF = function () {
                this.cor = 'Azul',
                    this.modelo = 'Boing 787',
                    this.levantarVoo = function () { console.log('Voo levantado') }
            }

            let a2 = new AviaoF()

            //classe
            class AviaoC {
                constructor() {
                    this.cor = 'Vermelho'    
                    this.modelo = 'Embraer E-Jets'
                    this.levantarVoo = function () { console.log('Voo levantado') }
                }
                levantarVoo() {
                    console.log('Levantar Voo')
                }
            }

            let a3 = new AviaoC()

            console.log(a1)
            console.log(a2)
            console.log(a3)
        </script>
    </head>

    <body>
        <div id="output"></div> 
    </body>
</html>
