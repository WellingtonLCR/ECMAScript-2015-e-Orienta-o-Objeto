<!DOCTYPE html>
<html>
    <head>
        <title>Object Prototype Chain</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">

            Object.prototype.attr50 = 'Z' //cuida com o metodo 

            let animal = { attr1: 'A' }

            let vertebrado = {
                __proto__: animal, attr2: 'B'
            }

            let ave = {
                __proto__: vertebrado, attr3: 'C', attr2: 'X'
            }
            
            console.log(ave.attr3, ave.attr2, ave.attr1, ave.attr50)
        </script>
    </head>

    <body>
        <div id="output"></div>
    </body>
</html>
