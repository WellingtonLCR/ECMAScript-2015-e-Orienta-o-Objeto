<!DOCTYPE html>
<html>
    <head>
        <title>Objeto Literal - Melhorias na Notação</title>

        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

        <script type="text/babel">

            let nome = 'Jorge'
            let idade = 29
            let sexo = 'Masculino'
            let profissao = 'Programador'

            let objeto = {
                nome: nome,
                idade: idade,
                sexo: sexo,
                profissao: profissao,
                exibirResumo: function () {
                    console.log(`${this.nome} tem ${this.idade}, ${this.sexo} e trabalha como ${this.profissao}`)
                }
            }

            let objeto2 = {
                nome,
                idade,
                sexo,
                profissao,
                exibirResumo() {
                    console.log(`${this.nome} tem ${this.idade}, ${this.sexo} e trabalha como ${this.profissao}`)
                }
            }

            console.log(objeto)
            objeto.exibirResumo()

            console.log(objeto2)
            objeto.exibirResumo()
        </script>
    </head>

    <body>
        <div id="output"></div>
    </body>
</html>
